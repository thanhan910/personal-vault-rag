[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "personal-vault-rag"
version = "0.2.0"
description = "Vault-isolated personal retrieval service with MCP access"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "cryptography==45.0.6",
  "qdrant-client==1.19.0",
  "mcp==2.1.1",
  "voyageai==0.5.0",
  "pypdf==6.0.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "openpyxl==3.1.5",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
worker = [
  "docling==2.126.0",
  "faster-whisper==1.2.1",
]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
